# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop -- copied from FabricMC's own
# fabric-example-mod (26.2 branch) plus the newest matching Fabric API build,
# 2026-09-14.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0+26.2
maven_group=com.zrp8858.blockplacementshuffler

# Dependencies
fabric_api_version=0.160.0+26.2
# Optional, compile-only: lets us add a Mod Menu config-screen entrypoint.
# Not required at runtime -- Mod Menu only invokes it if the player has
# Mod Menu installed.
modmenu_version=20.0.2
