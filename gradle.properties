# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop -- FabricMC's own
# fabric-example-mod has no 26.3 branch yet as of this port (2026-09-18), so
# these are taken directly from Fabric's meta API / Modrinth instead of
# copied from a reference branch.
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0+26.3
maven_group=com.zrp8858.blockplacementshuffler

# Dependencies
fabric_api_version=0.160.7+26.3
# Optional, compile-only: lets us add a Mod Menu config-screen entrypoint.
# Not required at runtime -- Mod Menu only invokes it if the player has
# Mod Menu installed. 21.0.0-beta.1 is the only build targeting 26.3 so far;
# switch to a stable release once TerraformersMC ships one.
modmenu_version=21.0.0-beta.1
